apiVersion: 1
groups:
    - orgId: 1
      name: maintenance-alerts
      folder: Maintenance Service
      interval: 1m
      rules:
        - uid: fg13gwjnug3k0d
          title: Maintenance API Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: up{job="maintenance-api"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: Prometheus reports that the maintenance API is down. Check the API container, Nginx and Prometheus target status.
            summary: Maintenance API is unavailable
          labels: {}
          isPaused: false
          notification_settings:
            receiver: empty
